kotlin.code.style=official
org.gradle.configuration-cache=true

# Gradle's defaults (-Xmx512m, -XX:MaxMetaspaceSize=384m) are too small for a daemon that serves many
# builds of a project whose KSP processor is itself a subproject: each processor-classpath change
# loads a new classloader, and metaspace grows build over build until :common:kspKotlin dies with
# "OutOfMemoryError: Metaspace". Heap was never the constraint (37% at the failure); metaspace was.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
